[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-forensics"
version = "1.5.0"
description = "Generic local static APK forensics toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "APK Forensics Contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
android = ["androguard>=3.4"]
elf = ["pyelftools>=0.31"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "jsonschema>=4.20",
]
all = [
  "androguard>=3.4",
  "pyelftools>=0.31",
  "pytest>=8",
  "pytest-cov>=5",
  "jsonschema>=4.20",
]

[project.scripts]
apk-forensics = "apk_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
