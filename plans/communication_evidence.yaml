# SearchPlan — Communication Evidence (v1.0)
# Builds on Bluetooth transport + evidence graph; does not invent protocol identity.
schema_version: "1.0"

plan:
  name: communication_evidence
  description: >
    Bounded static communication dataflow above Bluetooth transport:
    InputStream/OutputStream bytes → buffers → decoder/encoder → message/object.
    Method names never establish BCL/Etch/RHMI/SCN6 semantics.
  modules:
    - manifest
    - zip_inventory
    - dex
    - strings
    - uuid
    - candidate
    - dex_context
    - xref
    - bluetooth
    - native

input:
  description: APK path provided by CLI / workspace (not by this plan).

search:
  terms:
    - BluetoothSocket
    - createRfcommSocketToServiceRecord
    - getInputStream
    - getOutputStream
    - InputStream
    - OutputStream
    - ByteBuffer
    - System.arraycopy
    - DataInputStream
    - DataOutputStream
  regex:
    - "createRfcommSocket.*"
  uuids:
    - "00001101-0000-1000-8000-00805F9B34FB"
  api_patterns:
    - bluetooth
    - rfcomm

dex_context:
  enabled: true
  instruction_window: 8
  xref_depth: 2
  max_callers: 20
  max_callees: 20

bluetooth:
  enabled: true
  dataflow_depth: 3
  window: 12
  max_paths: 50
  max_results: 100
  caller_depth: 2
  reconstruct_callers: true
  reconstruct_streams: true
  reconstruct_read_write: true
  max_callers: 50
  max_callees: 50
  max_dataflow_paths: 50
  max_dataflow_nodes: 200
  interprocedural: true
  max_method_hops: 3
  max_field_hops: 2
  max_object_nodes: 500

evidence_graph:
  enabled: true
  canonicalize: true
  deduplicate: true
  extract_paths: true
  include_boundaries: true
  max_evidence_paths: 50

communication:
  enabled: true
  interprocedural: true
  max_method_hops: 3
  max_field_hops: 2
  max_object_nodes: 500
  max_dataflow_paths: 100
  max_buffer_hops: 5
  max_parser_hops: 3
  max_message_hops: 3

evidence:
  classifications:
    - FACT
    - CORRELATION
    - INFERENCE
    - UNKNOWN

limits:
  max_results: 100
  max_contexts: 100
  max_xrefs: 1000
  max_chains: 20

output:
  format:
    - json
    - markdown
  include_raw: false

profile:
  name: bmw_connected
