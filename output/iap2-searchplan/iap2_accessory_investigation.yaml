schema_version: '1.0'
plan:
  name: iap2_accessory_investigation
  description: 'User investigation goal (search intention, not evidence):

    Untersuche eine Android-APK auf Hinweise auf iAP / iAP2 bzw. das Apple iPod Accessory
    Protocol und verfolge die damit verbundenen Kommunikations-, Byte-, Buffer-, Object-
    und Application-Flows so weit, wie die vorhandene statische Analyse dies unterstützt.


    Enriched manually with accessory/transport/buffer/auth search terms. Terms are
    search targets only — not protocol FACT.'
  modules:
  - bluetooth
  - candidate
  - dex
  - dex_context
  - manifest
  - strings
  - uuid
  - xref
  - zip_inventory
search:
  terms:
  - Accessory Protocol
  - AccessorySocket
  - Apple Accessory
  - BluetoothSocket
  - ByteBuffer
  - DataInputStream
  - DataOutputStream
  - EASession
  - InputStream
  - OutputStream
  - Socket
  - System.arraycopy
  - UsbAccessory
  - UsbDevice
  - UsbInterface
  - authenticate
  - authentication
  - buffer
  - certificate
  - challenge
  - createRfcommSocketToServiceRecord
  - decode
  - encode
  - frame
  - handshake
  - iAP
  - iAP2
  - iPod
  - iPod Accessory
  - message
  - packet
  - parse
  - response
  - signature
  regex: []
  uuids: []
  api_patterns:
  - android
  - bluetooth
  - network
  - rfcomm
  - socket
  - usb
dex_context:
  enabled: true
  instruction_window: 12
  xref_depth: 2
  max_callers: 20
  max_callees: 20
bluetooth:
  enabled: true
  dataflow_depth: 3
  window: 12
  max_paths: 50
  max_results: 100
  target: null
  caller_depth: 2
  reconstruct_callers: true
  reconstruct_streams: true
  reconstruct_read_write: true
  max_callers: 50
  max_callees: 50
  max_dataflow_paths: 50
  max_dataflow_nodes: 200
  interprocedural: true
  max_method_hops: 5
  max_field_hops: 4
  max_object_nodes: 500
evidence_graph:
  enabled: true
  canonicalize: true
  deduplicate: true
  extract_paths: true
  include_boundaries: true
  max_evidence_paths: 50
communication:
  enabled: true
  interprocedural: true
  max_method_hops: 5
  max_field_hops: 4
  max_object_nodes: 500
  max_dataflow_paths: 100
  max_buffer_hops: 8
  max_parser_hops: 3
  max_message_hops: 3
correlation:
  enabled: false
  timestamp_window_ms: 50
  max_runtime_events: 10000
  max_wire_packets: 10000
  max_correlations: 500
  require_direction_match: true
  allow_fragmentation: true
  allow_aggregation: true
evidence:
  classifications:
  - FACT
  - CORRELATION
  - INFERENCE
  - UNKNOWN
limits:
  max_results: 100
  max_contexts: 100
  max_xrefs: 1000
  max_chains: 20
  max_findings: 10000
output:
  format:
  - json
  - markdown
  include_raw: false
profile:
  name: null
  path: null
